<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Favicon con el logo del gimnasio -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- PWA: manifest y tema -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#F5C400" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Ragnar" />

    <!-- SEO básico -->
    <meta
      name="description"
      content="Ragnar Cross Training — Gestión de atletas, RMs y pagos"
    />
    <meta name="robots" content="noindex" />

    <title>Ragnar Cross Training</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Registro del service worker para PWA.
         Además de registrarlo, se escucha "controllerchange": ese evento se
         dispara automáticamente apenas una versión nueva del Service Worker
         toma el control de la página (nuestro sw.js ya hace skipWaiting() +
         clients.claim() en cuanto detecta una versión nueva). Sin este
         listener, la pestaña seguía usando en memoria el JS viejo aunque el
         SW ya hubiera cambiado — por eso quedaba en pantalla negra hasta que
         alguien limpiaba el caché a mano. Con esto, se recarga sola. -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((reg) => {
              console.log("Service worker registrado:", reg.scope);
              // Forzar el chequeo de una versión nueva apenas carga la página
              reg.update();
            })
            .catch((err) => console.log("Error al registrar SW:", err));
        });

        let yaRecargando = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (yaRecargando) return;
          yaRecargando = true;
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
